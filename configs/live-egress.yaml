artifact_schema_version: 1
status: approved_week_01_to_week_02
reviewed_on: 2026-08-06

# 실제 API로 보내는 자료와 실행 상한의 기준 파일이다.
# API key 값, 과거 실행 결과와 사람의 승인 기록은 저장하지 않는다.
destinations:
  nvidia_nim:
    endpoint: https://integrate.api.nvidia.com/v1
    operator: NVIDIA
  google_ai_studio:
    endpoint: https://generativelanguage.googleapis.com/v1beta
    operator: Google AI Studio
    plan: free
    data_use: product_improvement_allowed_by_free_tier_terms

payload:
  sent:
    - AIHub PDF에서 만든 페이지 JPEG
    - 한국어 질문
    - 구조화 답변용 시스템 지시문(system prompt)
  not_sent:
    - PDF 추출 문장
    - 기대 정답과 채점기(scorer) 결과
    - 다른 API 제공자(provider)의 응답
    - API key

approval_conditions:
  scope: week_01_to_week_02_only
  execution_order: probe_then_full
  sealed_test_allowed: false

runs:
  week_01_task:
    provider_contract:
      requested_model: nvidia_nim/nvidia/nemotron-3-nano-omni-30b-a3b-reasoning
      expected_actual_model: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning
      endpoint: https://integrate.api.nvidia.com/v1
      api_key_env: NVIDIA_NIM_API_KEY
    planned_scope:
      sample_count: 40
      fallback: false
      replay: false
      probe_caps:
        requests: 1
        input_tokens: 20000
        output_tokens: 500
        retries: 0
        cost_usd: 0.01
        wall_seconds: 120
      full_caps:
        requests: 40
        input_tokens: 800000
        output_tokens: 20000
        retries: 0
        cost_usd: 0.01
        wall_seconds: 7200

  week_02_prompt_comparison:
    provider_contract:
      requested_model: nvidia_nim/google/gemma-4-31b-it
      expected_actual_model: google/gemma-4-31b-it
      endpoint: https://integrate.api.nvidia.com/v1
      api_key_env: NVIDIA_NIM_API_KEY
    planned_scope:
      sample_count_per_prompt: 40
      prompt_count: 2
      fallback: false
      replay: false
      probe_caps:
        requests: 1
        input_tokens: 20000
        output_tokens: 500
        retries: 0
        cost_usd: 0.01
        wall_seconds: 120
      full_caps:
        requests: 40
        input_tokens: 800000
        output_tokens: 20000
        retries: 0
        cost_usd: 0.01
        wall_seconds: 7200

  week_02_two_provider:
    provider_contracts:
      baseline:
        requested_model: nvidia_nim/google/gemma-4-31b-it
        expected_actual_model: google/gemma-4-31b-it
        endpoint: https://integrate.api.nvidia.com/v1
        api_key_env: NVIDIA_NIM_API_KEY
      candidate:
        requested_model: gemini/gemini-3.5-flash-lite
        expected_actual_model: gemini-3.5-flash-lite
        endpoint: https://generativelanguage.googleapis.com/v1beta
        api_key_env: GEMINI_API_KEY
    planned_scope:
      sample_count_per_provider: 40
      provider_count: 2
      fallback: false
