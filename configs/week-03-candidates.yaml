artifact_schema_version: 2

paths:
  case_authoring: data/opencqa/week-03-selection.yaml
  cases: local-data/opencqa/week-03-cases.jsonl
  prompt: prompts/open-cqa-answer-baseline.md
  raw_documents: local-data/opencqa/images
  prepared_documents: local-data/opencqa/images
  output: reports/week-03/student-full

documents:
  render_dpi: 150
  model_image_max_bytes: 175000
  model_image_max_width: 1024

provider:
  kind: litellm
  model: nvidia_nim/google/gemma-4-31b-it
  expected_actual_model: google/gemma-4-31b-it
  api_base: https://integrate.api.nvidia.com/v1
  api_key_env: NVIDIA_NIM_API_KEY
  structured_output: json_schema
  billing_basis: developer_program_free_endpoint
  pricing_source_url: https://docs.api.nvidia.com/nim/docs/product
  input_cost_per_token_usd: 0.0
  output_cost_per_token_usd: 0.0

limits:
  max_requests: 60
  requests_per_minute: 20
  max_retries: 0
  retry_initial_seconds: 5
  max_cost_usd: 0.01
  max_input_tokens: 1200000
  max_output_tokens: 30000
  max_wall_seconds: 7200
  request_input_token_ceiling: 20000
  request_output_token_ceiling: 500
  request_timeout_seconds: 120
